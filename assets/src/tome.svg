<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- DM Tome: a closed grimoire with a d20 on the cover -->
  <g fill="none" stroke="#000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- page block -->
    <path d="M24 16 h46 a6 6 0 0 1 6 6 v58 a6 6 0 0 1 -6 6 h-46"/>
    <!-- spine -->
    <path d="M24 16 a8 8 0 0 0 -8 8 v54 a8 8 0 0 0 8 8"/>
    <path d="M16 78 a8 8 0 0 1 8 -8 h52"/>
    <!-- clasp -->
    <path d="M70 40 h6 v12 h-6"/>
    <!-- d20 on cover -->
    <polygon points="45,30 59,38 59,54 45,62 31,54 31,38"/>
    <polygon points="45,30 59,54 31,54" stroke-width="3.5"/>
    <path d="M45 30 v8 M59 54 l-8 -6 M31 54 l8 -6" stroke-width="3.5"/>
  </g>
</svg>
